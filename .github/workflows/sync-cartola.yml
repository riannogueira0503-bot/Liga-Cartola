name: Atualizar dados do Cartola

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-liga:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar a liga
        env:
          CARTOLA_TOKEN: ${{ secrets.CARTOLA_TOKEN }}
        run: node scripts/sync-cartola.mjs

      - name: Publicar dados atualizados
        run: |
          git config user.name "Liga Cartola Bot"
          git config user.email "actions@github.com"
          git add data/league.json
          git diff --staged --quiet || git commit -m "Atualiza dados do Cartola"
          git push
